canvas:
  scale: 2
  margin: 50
  column_gap: 260
  row_gap: 72
  pin_gap: 22

blocks:
  RG_A:
    symbol: RG
    label: Регистр A
    position: [1, 0]
    inputs: ["D[0:14]"]
    outputs: ["Q[0:14]"]
    min_width: 150
  XOR1:
    symbol: XOR
    position: [2, 0]
    inputs: ["A[0:14]", "B[0:14]"]
    outputs: ["Y[0:14]"]
  MX1:
    symbol: MX
    position: [3, 0]
    inputs: ["A[0:14]", "B[0:14]", SEL]
    outputs: ["Q[0:14]"]
  RG_B:
    symbol: RG
    label: Регистр B
    position: [4, 0]
    inputs: ["D[0:14]"]
    outputs: ["Q[0:14]"]
    min_width: 150

ports:
  BUS_IN:
    label: Шина входа
    direction: input
    position: [0, 0]
  SEL:
    label: Выбор
    direction: input
    position: [2, 1]
  BUS_OUT:
    label: Шина выхода
    direction: output
    position: [5, 0]

connections:
